---
- name: Install ffmpeg
  ansible.builtin.apt:
    name: ffmpeg
    state: present

- name: Media apps configuration
  become: true
  become_user: www-data
  block:
    - name: Media configuration
      ansible.builtin.copy:
        dest: "{{ nextcloud_webroot }}/config/ansible-media.json"
        mode: "0640"
        content: "{{ nextcloud_media_config | to_nice_json }}"
      vars:
        nextcloud_media_config:
          system:
            preview_max_x: 1024
            preview_max_y: 1920
            jpeg_quality: 60
            enabledPreviewProviders:
              - OC\Preview\Movie
              - OC\Preview\PNG
              - OC\Preview\JPEG
              - OC\Preview\GIF
              - OC\Preview\BMP
              - OC\Preview\XBitmap
              - OC\Preview\MP3
              - OC\Preview\MP4
              - OC\Preview\TXT
              - OC\Preview\MarkDown
              - OC\Preview\PDF
              - OC\Preview\HEIC
              - OC\Preview\WebP
          apps:
            previewgenerator:
              squareSizes: "32 64 1024"
              widthSizes: "64 128 1024"
              heightSizes: "64 256 1024"
            preview:
              jpeg_quality: "60"
      register: nextcloud_media_config_file

    - name: Import media configuration
      ansible.builtin.command:
        cmd: "{{ nextcloud_occ }} config:import {{ nextcloud_webroot }}/config/ansible-media.json"
      when: nextcloud_media_config_file is changed  # noqa: no-handler
      changed_when: true

    # skips models that are already downloaded
    - name: Download recognize models
      ansible.builtin.command:
        cmd: "{{ nextcloud_occ }} recognize:download-models"
      changed_when: false

- name: Previewgenerator service
  ansible.builtin.copy:
    mode: "0644"
    dest: /etc/systemd/system/previewgenerator.service
    content: |
      [Unit]
      Description=nextcloud preview generator pre generate

      [Service]
      User=www-data
      ExecStart=/usr/bin/php {{ nextcloud_webroot }}/occ preview:pre-generate
      KillMode=process
  notify: Reload systemd

- name: Previewgenerator timer
  ansible.builtin.copy:
    mode: "0644"
    dest: /etc/systemd/system/previewgenerator.timer
    content: |
      [Unit]
      Description=run nextcloud preview generator pre generate every 10 min

      [Timer]
      OnBootSec=10min
      OnUnitActiveSec=10min
      Unit=previewgenerator.service

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Reload systemd for previewgenerator
  ansible.builtin.meta: flush_handlers

- name: Start and enable previewgenerator timer
  ansible.builtin.systemd_service:
    name: previewgenerator.timer
    state: started
    enabled: true
