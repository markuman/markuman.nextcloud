---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ nextcloud_fqdn.split('.')[0] }}"
  when: nextcloud_manage_hostname

- name: Complete /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ nextcloud_fqdn }} {{ nextcloud_fqdn.split('.')[0] }}"
  when: nextcloud_manage_hostname

- name: Upgrade all packages first
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install packages
  ansible.builtin.apt:
    name: "{{ nextcloud_packages }}"
    state: present

- name: Install redis
  ansible.builtin.apt:
    name:
      - redis-server
      - "php{{ nextcloud_php_version }}-redis"
    state: present
  when: nextcloud_install_redis

- name: Ensure redis is started and enabled
  ansible.builtin.systemd_service:
    name: redis-server
    state: started
    enabled: true
  when: nextcloud_install_redis

- name: Firewall
  when: nextcloud_firewall
  block:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Enable ipv6 for ufw
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: ^IPV6=
        line: IPV6=yes
      notify: Reload ufw

    - name: Limit incoming ssh
      community.general.ufw:
        rule: limit
        port: "22"
        proto: tcp
        comment: incoming ssh with ratelimit

    - name: Allow incoming http(s)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        comment: incoming http(s) for nginx
      loop:
        - "80"
        - "443"

    - name: Allow outgoing traffic
      community.general.ufw:
        rule: allow
        direction: out
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop:
        - {port: "22", proto: tcp, comment: outgoing ssh}
        - {port: "53", proto: any, comment: outgoing dns}
        - {port: "80", proto: tcp, comment: outgoing http}
        - {port: "123", proto: udp, comment: outgoing ntp}
        - {port: "443", proto: tcp, comment: outgoing https}
        - {port: "465", proto: tcp, comment: outgoing smtp ssl}
        - {port: "587", proto: tcp, comment: outgoing smtp submission}
        - {port: "993", proto: tcp, comment: outgoing imap ssl}

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Ensure fail2ban is started and enabled
      ansible.builtin.systemd_service:
        name: fail2ban
        state: started
        enabled: true

- name: OS hardening
  ansible.builtin.include_role:
    name: devsec.hardening.os_hardening
  vars:
    os_auditd_max_log_file_action: "{{ nextcloud_os_auditd_max_log_file_action }}"
  when: nextcloud_os_hardening

- name: Flush handlers for os hardening
  ansible.builtin.meta: flush_handlers
