---
- name: Nextcloud php-fpm pool
  ansible.builtin.template:
    src: php-fpm-pool.conf.j2
    dest: "/etc/php/{{ nextcloud_php_version }}/fpm/pool.d/nextcloud.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart php-fpm

- name: Remove default php-fpm pool
  ansible.builtin.file:
    path: "/etc/php/{{ nextcloud_php_version }}/fpm/pool.d/www.conf"
    state: absent
  notify: Restart php-fpm

- name: Nextcloud php settings
  ansible.builtin.template:
    src: php.ini.j2
    dest: "/etc/php/{{ nextcloud_php_version }}/{{ item }}/conf.d/90-nextcloud.ini"
    owner: root
    group: root
    mode: "0644"
  loop:
    - fpm
    - cli
  notify: Restart php-fpm

- name: Ensure php-fpm is started and enabled
  ansible.builtin.systemd_service:
    name: "php{{ nextcloud_php_version }}-fpm"
    state: started
    enabled: true

- name: Flush handlers for php update
  ansible.builtin.meta: flush_handlers
