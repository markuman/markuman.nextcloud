---
- name: Check for existing nextcloud installation
  ansible.builtin.stat:
    path: "{{ nextcloud_webroot }}/version.php"
  register: nextcloud_version_php

- name: Download and verify nextcloud
  when: not nextcloud_version_php.stat.exists
  block:
    - name: Create nextcloud keyring directory
      ansible.builtin.file:
        path: /usr/local/share/nextcloud
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy nextcloud signing key
      ansible.builtin.copy:
        src: nextcloud.asc
        dest: /usr/local/share/nextcloud/nextcloud.asc
        owner: root
        group: root
        mode: "0644"
      register: nextcloud_signing_key

    - name: Create keyring with the nextcloud signing key only
      ansible.builtin.command:
        cmd: gpg --batch --yes --dearmor --output /usr/local/share/nextcloud/nextcloud.gpg /usr/local/share/nextcloud/nextcloud.asc
      changed_when: true
      when: nextcloud_signing_key is changed  # noqa: no-handler

    - name: Download nextcloud
      ansible.builtin.get_url:
        url: "https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.zip"
        dest: "/var/tmp/nextcloud-{{ nextcloud_version }}.zip"
        checksum: "sha256:https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.zip.sha256"
        mode: "0644"

    - name: Download nextcloud signature
      ansible.builtin.get_url:
        url: "https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.zip.asc"
        dest: "/var/tmp/nextcloud-{{ nextcloud_version }}.zip.asc"
        mode: "0644"

    - name: Verify nextcloud signature
      ansible.builtin.command:
        cmd: >-
          gpgv --keyring /usr/local/share/nextcloud/nextcloud.gpg
          /var/tmp/nextcloud-{{ nextcloud_version }}.zip.asc
          /var/tmp/nextcloud-{{ nextcloud_version }}.zip
      changed_when: false

    - name: Extract nextcloud
      ansible.builtin.unarchive:
        remote_src: true
        src: "/var/tmp/nextcloud-{{ nextcloud_version }}.zip"
        dest: "{{ nextcloud_webroot | dirname }}"
        owner: www-data
        group: www-data
        creates: "{{ nextcloud_webroot }}/version.php"

- name: Create nextcloud data directory
  ansible.builtin.file:
    path: "{{ nextcloud_data_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0770"

- name: Nextcloud occ commands
  become: true
  become_user: www-data
  block:
    - name: Get nextcloud status
      ansible.builtin.command:
        cmd: "{{ nextcloud_occ }} status --output=json"
      register: nextcloud_status
      changed_when: false

    - name: Install nextcloud
      ansible.builtin.command:
        argv:
          - php
          - "{{ nextcloud_webroot }}/occ"
          - maintenance:install
          - --database=mysql
          - --database-host=localhost
          - "--database-name={{ nextcloud_db_name }}"
          - "--database-user={{ nextcloud_db_user }}"
          - "--database-pass={{ nextcloud_db_password }}"
          - "--admin-user={{ nextcloud_admin_user }}"
          - "--admin-pass={{ nextcloud_admin_password }}"
          - "--data-dir={{ nextcloud_data_dir }}"
      when: not (nextcloud_status.stdout | from_json).installed
      register: nextcloud_install
      changed_when: true
      no_log: true

    - name: Run expensive repair steps (mimetype migrations) after the installation
      ansible.builtin.command:
        cmd: "{{ nextcloud_occ }} maintenance:repair --include-expensive"
      when: nextcloud_install is changed  # noqa: no-handler
      changed_when: true

    - name: Nextcloud configuration
      ansible.builtin.copy:
        dest: "{{ nextcloud_webroot }}/config/ansible.json"
        mode: "0640"
        content: "{{ nextcloud_config | to_nice_json }}"
      vars:
        nextcloud_config: >-
          {{ nextcloud_base_config
             | combine(nextcloud_redis_config if nextcloud_install_redis else {},
                       {'system': {'default_phone_region': nextcloud_default_phone_region}} if nextcloud_default_phone_region else {},
                       nextcloud_extra_config,
                       recursive=true) }}
      register: nextcloud_config_file

    - name: Import nextcloud configuration
      ansible.builtin.command:
        cmd: "{{ nextcloud_occ }} config:import {{ nextcloud_webroot }}/config/ansible.json"
      # no handler, the configuration must be applied before the apps are installed
      when: nextcloud_config_file is changed  # noqa: no-handler
      changed_when: true

    - name: Get nextcloud apps
      ansible.builtin.command:
        cmd: "{{ nextcloud_occ }} app:list --output=json"
      register: nextcloud_app_list
      changed_when: false

    # occ returns [] instead of {} for empty lists
    - name: Sort nextcloud apps
      ansible.builtin.set_fact:
        nextcloud_enabled_apps: "{{ ((nextcloud_app_list.stdout | from_json).enabled or {}) | list }}"
        nextcloud_disabled_apps: "{{ ((nextcloud_app_list.stdout | from_json).disabled or {}) | list }}"

    - name: Install nextcloud apps
      ansible.builtin.command:
        cmd: "{{ nextcloud_occ }} app:install {{ item }}"
      loop: "{{ nextcloud_all_apps | difference(nextcloud_enabled_apps + nextcloud_disabled_apps) }}"
      register: nextcloud_app_install
      changed_when: true
      retries: 3
      delay: 10
      until: nextcloud_app_install is not failed

    - name: Enable nextcloud apps
      ansible.builtin.command:
        cmd: "{{ nextcloud_occ }} app:enable {{ item }}"
      loop: "{{ nextcloud_all_apps | intersect(nextcloud_disabled_apps) }}"
      changed_when: true

- name: Nextcloud cron service
  ansible.builtin.copy:
    mode: "0644"
    dest: /etc/systemd/system/nextcloudcron.service
    content: |
      [Unit]
      Description=Nextcloud cron.php job

      [Service]
      User=www-data
      ExecStart=/usr/bin/php -f {{ nextcloud_webroot }}/cron.php
      KillMode=process
  notify: Reload systemd

- name: Nextcloud cron timer
  ansible.builtin.copy:
    mode: "0644"
    dest: /etc/systemd/system/nextcloudcron.timer
    content: |
      [Unit]
      Description=Run Nextcloud cron.php every 5 minutes

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=5min
      Unit=nextcloudcron.service

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Reload systemd for nextcloud cron
  ansible.builtin.meta: flush_handlers

- name: Start and enable nextcloud cron timer
  ansible.builtin.systemd_service:
    name: nextcloudcron.timer
    state: started
    enabled: true

- name: Setup event scheduler to remove dead authtokens
  when: nextcloud_remove_unused_authtokens_after_days | int > 0
  ansible.mariadb.mariadb_query:
    login_db: "{{ nextcloud_db_name }}"
    login_unix_socket: "{{ nextcloud_mariadb_socket }}"
    query: >
      CREATE EVENT IF NOT EXISTS remove_unused_authtokens
        ON SCHEDULE EVERY 1 DAY
        STARTS now()
        DO
        DELETE FROM oc_authtoken
          WHERE from_unixtime(last_activity) < DATE_SUB(NOW(), INTERVAL {{ nextcloud_remove_unused_authtokens_after_days }} DAY);
  changed_when: false
