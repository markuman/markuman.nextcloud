---
# root@localhost authenticates via unix_socket on Debian, so no root password is needed.

- name: MariaDB server settings
  ansible.builtin.template:
    src: mariadb.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/90-nextcloud.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mariadb

- name: Restart mariadb, because nextcloud needs the event scheduler and READ-COMMITTED
  ansible.builtin.meta: flush_handlers

- name: Ensure mariadb is started and enabled
  ansible.builtin.systemd_service:
    name: mariadb
    state: started
    enabled: true

- name: Remove anonymous users
  ansible.mariadb.mariadb_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: "{{ nextcloud_mariadb_socket }}"

- name: Remove test database
  ansible.mariadb.mariadb_db:
    name: test
    state: absent
    login_unix_socket: "{{ nextcloud_mariadb_socket }}"

- name: Create nextcloud database
  ansible.mariadb.mariadb_db:
    name: "{{ nextcloud_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_general_ci
    state: present
    login_unix_socket: "{{ nextcloud_mariadb_socket }}"

- name: Create nextcloud database user
  ansible.mariadb.mariadb_user:
    name: "{{ nextcloud_db_user }}"
    host: localhost
    password: "{{ nextcloud_db_password }}"
    priv: "{{ nextcloud_db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ nextcloud_mariadb_socket }}"

- name: Database credentials for the nextcloud system user
  community.general.ini_file:
    path: "/home/{{ nextcloud_system_user }}/.my.cnf"
    owner: "{{ nextcloud_system_user }}"
    group: "{{ nextcloud_system_user }}"
    mode: "0600"
    section: client
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  loop:
    - {option: user, value: "{{ nextcloud_db_user }}"}
    - {option: password, value: "{{ nextcloud_db_password }}"}
    - {option: database, value: "{{ nextcloud_db_name }}"}
    - {option: default-character-set, value: utf8mb4}
  loop_control:
    label: "{{ item.option }}"
