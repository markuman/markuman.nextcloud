---
# required, see meta/argument_specs.yml
# nextcloud_fqdn:
# nextcloud_admin_user:
# nextcloud_admin_password:
# nextcloud_db_password:
# nextcloud_system_user:
# nextcloud_system_user_ssh_key:
# nextcloud_letsencrypt_mail:          # only for nextcloud_tls_mode: letsencrypt

nextcloud_version: 35.0.2
nextcloud_php_version: "8.4"

nextcloud_webroot: /var/www/nextcloud
nextcloud_data_dir: "{{ nextcloud_webroot }}/data"

nextcloud_db_name: nextcloud
nextcloud_db_user: nextcloud

# nextcloud apps
nextcloud_install_talk: true
nextcloud_install_media: true
nextcloud_install_redis: true
nextcloud_apps:
  - bruteforcesettings
  - twofactor_totp

# merged into the generated config.php settings (occ config:import format)
nextcloud_default_phone_region: ""
nextcloud_extra_config: {}

# webserver
# letsencrypt: certificate from let's encrypt via certbot (webroot)
# selfsigned: debian snakeoil certificate (testing only)
nextcloud_tls_mode: letsencrypt
nextcloud_max_upload_size: 10G
nextcloud_hsts_max_age: 31536000
# modsecurity v3 + owasp crs
# On, DetectionOnly or Off. always quote, yaml 1.1 turns unquoted On/Off into booleans
nextcloud_modsecurity_engine: "On"
nextcloud_modsecurity_paranoia_level: 1
# bytes inspected per request body. webdav uploads (PUT/MOVE/COPY) skip the body
# inspection, larger bodies are inspected partially (ProcessPartial)
nextcloud_modsecurity_request_body_limit: 104857600
# RelevantOnly: requests matching nextcloud_modsecurity_audit_relevant_status
# or a rule. waf hits are always logged
nextcloud_modsecurity_audit_engine: RelevantOnly
# "^5" only adds server errors. the modsecurity default "^(?:5|4(?!04))"
# floods the log with application 4xx (csrf, old clients)
nextcloud_modsecurity_audit_relevant_status: "^5"
# A=header, F=response headers, H=trailer with the matched rules, Z=end.
# no B/I/J (request headers, body, uploads): they leak app passwords,
# session cookies and documents into the log. use "ABFHZ" for tuning
nextcloud_modsecurity_audit_log_parts: AFHZ
# own rules (tuning, exclusions). load order:
#   modsecurity.conf -> crs-setup -> nextcloud -> before_crs -> crs -> after_crs
#   before_crs (default): SecAction setvar, ctl exclusions
#   after_crs:            SecRuleUpdateTarget*, SecRuleRemove*
# rule ids 1000-1099 are used by the role
# nextcloud_modsecurity_custom_rules:
#   - name: 10-block-shell-substitution
#     phase: before_crs
#     content: |
#       SecRule REQUEST_URI_RAW "@contains ${IFS}" "id:10000,phase:1,deny,status:403,log,msg:'shell IFS in uri'"
nextcloud_modsecurity_custom_rules: []

# php
nextcloud_php_memory_limit: 1G
nextcloud_php_fpm:
  max_children: 120
  start_servers: 12
  min_spare_servers: 8
  max_spare_servers: 40
nextcloud_opcache_interned_strings_buffer: 16

# mariadb
nextcloud_innodb_buffer_pool_size: 1G
nextcloud_remove_unused_authtokens_after_days: 21

# talk / coturn
nextcloud_coturn_listening_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

# system
nextcloud_manage_hostname: true
nextcloud_firewall: true
nextcloud_reboot: true

# os and ssh hardening (devsec.hardening)
nextcloud_os_hardening: true
nextcloud_ssh_hardening: true
nextcloud_os_auditd_max_log_file_action: rotate
nextcloud_ssh_allow_users: "{{ nextcloud_system_user }}"
nextcloud_ssh_max_auth_retries: 5
