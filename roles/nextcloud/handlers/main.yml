---
- name: Reload ufw
  community.general.ufw:
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart mariadb
  ansible.builtin.systemd_service:
    name: mariadb
    state: restarted

- name: Restart php-fpm
  ansible.builtin.systemd_service:
    name: "php{{ nextcloud_php_version }}-fpm"
    state: restarted

# validate first: with a broken config the running nginx keeps the old one,
# instead of failing on the next restart
- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Reload nginx

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Restart coturn
  ansible.builtin.systemd_service:
    name: coturn
    state: restarted
