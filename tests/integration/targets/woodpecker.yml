---
# CI variant: nextcloud runs as a service container with plain http,
# so the passwords app (requires https) and talk are not tested here.
- name: Run integration tests in CI
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    nc_host: "{{ lookup('ansible.builtin.env', 'nc_host') }}"
    nc_user: "{{ lookup('ansible.builtin.env', 'nc_user') }}"
    nc_token: "{{ lookup('ansible.builtin.env', 'nc_token') }}"
    nc_ssl_mode: http

  module_defaults:
    group/markuman.nextcloud.nextcloud:
      ssl_mode: "{{ nc_ssl_mode }}"

  tasks:
    - name: Wait for nextcloud (pull image and install)
      ansible.builtin.uri:
        url: "http://{{ nc_host }}/status.php"
      register: status
      until: status.json is defined and status.json.installed | default(false)
      retries: 60
      delay: 5

    - name: Create a second user for user module tests
      ansible.builtin.uri:
        url: "http://{{ nc_host }}/ocs/v2.php/cloud/users"
        method: POST
        user: "{{ nc_user }}"
        password: "{{ nc_token }}"
        force_basic_auth: true
        headers:
          OCS-APIRequest: "true"
          Accept: application/json
        body_format: json
        body:
          userid: testuser
          password: "testuser_password_123!"
        status_code: [200, 400]

    - name: Info integration test
      ansible.builtin.include_role:
        name: info

    - name: User integration test
      ansible.builtin.include_role:
        name: user

    - name: File integration test
      ansible.builtin.include_role:
        name: file
