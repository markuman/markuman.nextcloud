---
- name: Prepare nextcloud container
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    nextcloud_image: "docker.io/library/nextcloud:{{ nextcloud_version | default('35-apache') }}"
    nextcloud_container: nextcloud-integrationtest

  tasks:
    - name: Start nextcloud container
      containers.podman.podman_container:
        name: "{{ nextcloud_container }}"
        image: "{{ nextcloud_image }}"
        state: started
        rm: true
        recreate: true
        publish:
          - "127.0.0.1:{{ nextcloud_http_port | default(18080) }}:80"
          - "127.0.0.1:{{ nextcloud_https_port | default(18443) }}:443"
        env:
          SQLITE_DATABASE: sqlite
          NEXTCLOUD_ADMIN_USER: ansible
          NEXTCLOUD_ADMIN_PASSWORD: nextcloud_collection
          NEXTCLOUD_TRUSTED_DOMAINS: localhost

    - name: Add nextcloud container to inventory
      ansible.builtin.add_host:
        name: "{{ nextcloud_container }}"
        groups: testing
        ansible_connection: containers.podman.podman
        ansible_python_interpreter: /usr/bin/python3

    - name: Wait until nextcloud is installed
      ansible.builtin.uri:
        url: "http://localhost:{{ nextcloud_http_port | default(18080) }}/status.php"
        return_content: true
      register: status
      until: status.json is defined and status.json.installed | default(false)
      retries: 60
      delay: 5


- name: Prepare apache with https
  hosts: testing
  gather_facts: false

  tasks:
    - name: Install ssl-cert for the snakeoil certificate
      ansible.builtin.apt:
        name: ssl-cert
        update_cache: true

    - name: Enable apache2 ssl module
      community.general.apache2_module:
        name: ssl
        state: present

    - name: Enable default-ssl site
      ansible.builtin.command: a2ensite default-ssl
      register: a2ensite
      changed_when: "'already enabled' not in a2ensite.stdout"

    - name: Reload apache2
      ansible.builtin.command: apache2ctl graceful
      changed_when: true


- name: Prepare nextcloud itself
  hosts: testing
  gather_facts: false
  remote_user: www-data

  tasks:
    # app store downloads tend to hang sometimes, so give it a few chances
    - name: Install passwords and talk app
      ansible.builtin.command: "timeout 180 php occ app:install {{ item }}"
      args:
        chdir: /var/www/html
      register: app_install
      changed_when: "'installed' in app_install.stdout"
      failed_when: app_install.rc != 0 and 'already installed' not in app_install.stdout
      until: app_install is not failed
      retries: 3
      delay: 5
      loop:
        - passwords
        - spreed

    - name: Create a second user for user module tests
      ansible.builtin.command: php occ user:add --password-from-env --display-name "Test User" testuser
      args:
        chdir: /var/www/html
      environment:
        OC_PASS: "testuser_password_123!"
      register: user_add
      changed_when: user_add.rc == 0
      failed_when: user_add.rc != 0 and 'already exists' not in user_add.stdout


- name: Run integration tests
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    nc_host: "localhost:{{ nextcloud_https_port | default(18443) }}"
    nc_user: ansible
    nc_token: nextcloud_collection
    nc_ssl_mode: skip

  module_defaults:
    group/markuman.nextcloud.nextcloud:
      host: "{{ nc_host }}"
      user: "{{ nc_user }}"
      api_token: "{{ nc_token }}"
      ssl_mode: "{{ nc_ssl_mode }}"

  tasks:
    - name: Integration tests
      block:
        - name: Info integration test
          ansible.builtin.include_role:
            name: info

        - name: User integration test
          ansible.builtin.include_role:
            name: user

        - name: File integration test
          ansible.builtin.include_role:
            name: file

        - name: Passwords integration test
          ansible.builtin.include_role:
            name: passwords

        - name: Talk integration test
          ansible.builtin.include_role:
            name: talk

      always:
        - name: Stop nextcloud container
          when: not (keep_container | default(false) | bool)
          containers.podman.podman_container:
            name: nextcloud-integrationtest
            state: absent
