---
when:
  - event: [push, pull_request, tag]

services:
  - name: nextcloud
    image: docker.io/library/nextcloud:35-apache
    environment:
      SQLITE_DATABASE: sqlite
      NEXTCLOUD_ADMIN_USER: ansible
      NEXTCLOUD_ADMIN_PASSWORD: nextcloud_collection
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud

steps:
  - name: sanity
    image: quay.io/ansible/ansible-core:latest
    commands:
      - mkdir -p /tmp/ansible_collections/markuman
      - cp -a . /tmp/ansible_collections/markuman/nextcloud
      - cd /tmp/ansible_collections/markuman/nextcloud
      - ansible-test sanity --requirements --python default

  - name: integration
    image: docker.io/library/python:3.13-slim
    environment:
      NEXTCLOUD_HOST: nextcloud
      NEXTCLOUD_USER: ansible
      NEXTCLOUD_TOKEN: nextcloud_collection
      NEXTCLOUD_SSL_MODE: http
    commands:
      - pip install --quiet ansible-core requests
      - ansible-galaxy collection build
      - ansible-galaxy collection install --no-deps markuman-nextcloud-*.tar.gz
      - cd tests/integration/targets/ && ansible-playbook woodpecker.yml
